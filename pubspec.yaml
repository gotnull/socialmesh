name: socialmesh
description: "A mesh radio companion app for Meshtastic. Connect over BLE, TCP or USB, message off-grid, map your nodes, and explore the mesh - no internet required."
publish_to: "none"

version: 1.61.0+205

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management (3.x with updated API)
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3

  # BLE Communication
  flutter_blue_plus: ^2.3.10
  nordic_dfu: ^7.1.3

  # USB Serial Communication
  usb_serial: ^0.5.2

  # Protobuf
  protobuf: ^6.0.0
  fixnum: ^1.1.0

  # MQTT Client (for device client proxy mode)
  mqtt_client: ^10.11.11
  typed_data: ^1.4.0

  # Storage
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.5
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.4.2
  # SQLCipher-backed sqflite for at-rest encryption of sensitive databases
  # (messages, signals, routes, waypoints, peer_safety, nodedex). Coexists
  # with plain sqflite, which still backs the non-sensitive databases.
  sqflite_sqlcipher: ^3.4.0
  path_provider: ^2.1.6
  path: ^1.9.0
  file_picker: ^12.0.0-beta.7
  image_picker: ^1.2.3
  photo_manager: ^3.11.0

  # QR Code
  mobile_scanner: ^7.4.0

  # Markdown rendering (Help Center knowledge base articles)
  flutter_markdown: ^0.7.6

  # UI/UX
  cupertino_icons: ^1.0.9
  flutter_compass: ^0.8.1
  flutter_map: ^8.3.1
  infinite_calendar_view: ^2.12.0
  latlong2: ^0.9.1
  intl: ^0.20.2
  collection: ^1.18.0
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  share_plus: ^13.3.0
  social_media_buttons: ^1.0.0
  sticker_view: ^0.0.4

  # Utilities
  archive: ^4.0.9
  clock: ^1.1.1
  logger: ^2.7.0
  uuid: ^4.6.0
  xml: ^7.0.1
  permission_handler: ^12.0.3
  image: ^4.9.1
  sensors_plus: ^7.1.0
  fl_chart: ^1.2.0
  url_launcher: ^6.3.1
  open_mail_launcher: 0.3.1
  connectivity_plus: ^7.3.1
  http: ^1.2.2
  flutter_dotenv: ^6.0.1
  flutter_local_notifications: ^22.2.0
  just_audio: ^0.10.6
  # Renders message text to audio for playback through a node's buzzer.
  # Synthesis happens here because it was measured as unintelligible when
  # done on the node itself.
  flutter_tts: ^4.2.3
  record: ^7.1.1
  live_activities: ^2.5.1
  package_info_plus: ^10.2.1
  device_info_plus: ^13.2.0

  # In-App Purchases (RevenueCat)
  purchases_flutter: ^10.7.0

  # Animations
  animations: ^2.1.2
  skeletonizer: ^2.1.3
  lottie: ^3.5.1
  scrollable_positioned_list: ^0.3.8
  flutter_map_marker_cluster: ^8.2.2
  firebase_crashlytics: ^5.2.4
  firebase_core: ^4.8.0
  firebase_analytics: ^12.4.2
  firebase_auth: ^6.5.4
  firebase_storage: ^13.4.5
  firebase_messaging: ^16.6.0
  characters: ^1.4.0
  cloud_firestore: ^6.7.1
  cloud_functions: ^6.3.2
  # Stripe SDK - native Payment Sheet for the external (off-store)
  # purchase path. Publishable key + merchantIdentifier configured
  # at app startup from .env.
  flutter_stripe: ^13.1.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0
  crypto: ^3.0.6
  flutter_box_transform: ^0.4.7
  flutter_inappwebview: ^6.1.5
  vector_math: ^2.2.0
  cryptography: ^2.9.0
  pointycastle: ^4.0.0

  # Camera for AR
  camera: ^0.12.0

  # Video streaming (HLS playback)
  video_player: ^2.13.0

  # Deep linking
  app_links: ^7.2.1
  timeago: ^3.7.1
  align_positioned: ^5.0.1

  # Background scheduling
  workmanager: ^0.9.0
  background_fetch: ^1.7.0
  timezone: ^0.11.0

  # Background BLE foreground service (Android)
  flutter_foreground_task: ^9.2.2

  # In-app review
  in_app_review: ^2.0.12
  pretty_qr_code: ^3.6.0
  emoji_picker_flutter: ^4.5.3
  ffi: ^2.2.0
  flutter_image_compress: ^2.5.1
  bonsoir: ^7.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.2
  mocktail: ^1.0.4

  # Launcher icons generator
  flutter_launcher_icons: ^0.14.3

  # Code generation (3.x to match riverpod 3.x)
  build_runner: ^2.15.1
  riverpod_generator: ^4.0.4
  json_serializable: ^6.14.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Fragment shaders
  shaders:
    - assets/shaders/card_dissolve.frag

  # Assets
  assets:
    # Generated from .env using the explicit client runtime allowlist. The raw
    # .env contains server credentials and must never enter a Flutter bundle.
    - .env.client
    - assets/app_icons/
    - assets/app_icons/source/
    - assets/pet/
    - assets/rtttl_library.json
    - assets/banned_words.json
    - assets/device_hardware.json
    - assets/help/manifest.json
    - assets/help/getting-started/
    - assets/help/mesh-basics/
    - assets/help/channels/
    - assets/help/messaging/
    - assets/help/nodes/
    - assets/help/device/
    - assets/help/network/
    - assets/help/safety/
    - assets/lottie/
    - assets/email_apps/
    - assets/models/
    - assets/terrain/
    - assets/meshtastic_powered_landscape.png
    # SIP Play + Handshake sound effects (Pixabay Content License —
    # see assets/sounds/sip_play/ATTRIBUTION.md for source files).
    - assets/sounds/sip_play/
    # Third-party license texts surfaced on the in-app LicensePage via
    # LicenseRegistry (bundled fonts, vendored codec2 + vs_node_view,
    # Meshtastic protobufs). See lib/core/third_party_licenses.dart.
    - assets/licenses/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

# Flutter launcher icons configuration
flutter_launcher_icons:
  android: true
  ios: false # iOS icons are already correct
  image_path: "assets/app_icons/source/socialmesh_icon_v4_1024.png"
  adaptive_icon_background: "#1F2633" # Dark background matching app theme
  adaptive_icon_foreground: "assets/app_icons/source/socialmesh_icon_v4_1024.png"
  min_sdk_android: 21
